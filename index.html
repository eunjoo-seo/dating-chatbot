<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating App Chat Mockup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="profile-screen">
            <div class="profile-header">
                <h2>John Peterson, 20</h2>
            </div>
            <div class="profile-details">
                <img src="john.png" class="profile-picture" alt="John Peterson">
                <h3>About</h3>
                <p>A good listener, I love having a good talk to know each other's side 😊</p>
                <h3>Interest</h3>
                <div class="interests">
                    <span class="interest-tag">Nature</span>
                    <span class="interest-tag">Travel</span>
                    <span class="interest-tag">Writing</span>
                    <span class="interest-tag">People</span>
                    <span class="interest-tag">Gym & Fitness</span>
                </div>
            </div>
            <button class="chat-button">Talk to AI VIRTUAL JOHN?</button>
        </div>

        <div class="chat-screen hidden">
            <div class="chat-header">
                <span class="back-arrow"><</span>
                <h3>AI Virtual John</h3>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be appended here by JavaScript -->
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Write a message">
                <button>></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
